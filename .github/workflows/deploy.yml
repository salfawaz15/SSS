name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Write secrets.dart
        run: |
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<'DARTEOF'
          class Secrets {
            static const String sendGridApiKey = "${{ secrets.SENDGRID_API_KEY }}";
            static const String senderEmail = "${{ secrets.SENDER_EMAIL }}";
            static const String recipientEmail = "${{ secrets.RECIPIENT_EMAIL }}";
          }
          DARTEOF

      - run: flutter pub get
      - run: flutter build web --release

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
