name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Write secrets.dart
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          mkdir -p lib/config
          KEY=$(printf '%s' "$SENDGRID_API_KEY" | tr -d '\r\n')
          SENDER=$(printf '%s' "$SENDER_EMAIL" | tr -d '\r\n')
          RECIPIENT=$(printf '%s' "$RECIPIENT_EMAIL" | tr -d '\r\n')
          cat > lib/config/secrets.dart <<DARTEOF
          class Secrets {
            static const String sendGridApiKey = "$KEY";
            static const String senderEmail = "$SENDER";
            static const String recipientEmail = "$RECIPIENT";
          }
          DARTEOF

      - run: flutter pub get
      - run: flutter build web --release

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
