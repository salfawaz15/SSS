name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Write secrets.dart
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          mkdir -p lib/config
          KEY=$(printf '%s' "$SENDGRID_API_KEY" | tr -d '\r\n')
          SENDER=$(printf '%s' "$SENDER_EMAIL" | tr -d '\r\n')
          RECIPIENT=$(printf '%s' "$RECIPIENT_EMAIL" | tr -d '\r\n')
          cat > lib/config/secrets.dart <<DARTEOF
          class Secrets {
            static const String sendGridApiKey = "$KEY";
            static const String senderEmail = "$SENDER";
            static const String recipientEmail = "$RECIPIENT";
          }
          DARTEOF

      - name: Generate version files from pubspec.yaml
        run: |
          FULL_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION_NAME=${FULL_VERSION%+*}
          BUILD_NUMBER=${FULL_VERSION#*+}
          cat > lib/app_version.dart <<DARTEOF
          const int kAppBuildNumber = $BUILD_NUMBER;
          const String kAppVersionName = '$VERSION_NAME';
          DARTEOF
          cat > web/version.json <<JSONEOF
          {"build": $BUILD_NUMBER, "version": "$VERSION_NAME"}
          JSONEOF

      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # توقيع APK ثابت لكل التشغيلات (بدل مفتاح debug عشوائي جديد بكل مُشغِّل
      # CI) - وإلا يرفض أندرويد أي تحديث لاحق بخطأ "package conflicts with
      # an existing package" (خلل حقيقي واجهه سليمان فعليًا 2026-08-25).
      # انظر التوثيق الكامل بـandroid/app/build.gradle.kts.
      - name: Write Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPEOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          PROPEOF

      - name: Build APK (advising flavor)
        run: flutter build apk --release --flavor advising -t lib/main_advising_app.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-advising-release
          path: build/app/outputs/flutter-apk/app-advising-release.apk
          retention-days: 30

      - name: Distribute APK via Firebase App Distribution
        run: |
          npx firebase-tools appdistribution:distribute \
            build/app/outputs/flutter-apk/app-advising-release.apk \
            --app 1:843787630334:android:01b9f5a9d7ea7712ea97af \
            --release-notes "نشر تلقائي من الفرع main - $(git log -1 --pretty=%s)" \
            --testers "salfawaz50@gmail.com" \
            --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # تطبيق "بوابة الإرشاد" (com.taif.cba.advisingportal) - نقطة دخول
      # منفصلة كليًا (lib/main_advising_portal.dart، معمارية lib/mobile_portal/)
      # عن "CBA Advising" القديم أعلاه (lib/main_advising_app.dart) - لم تكن
      # مبنية/موزَّعة عبر CI إطلاقًا رغم وجود flavor لها فعليًا بـ
      # android/app/build.gradle.kts، فكانت كل تحديثات بوابة الإرشاد الجوّالة
      # (كالشريط الموحَّد) لا تصل سليمان أبدًا عبر التوزيع التلقائي (اكتُشف
      # فعليًا 2026-08-25 حين وصلت رسالة تحديث "CBA Advising" القديم بدلاً
      # من "بوابة الإرشاد" الجديدة التي كان يتوقعها).
      - name: Build APK (advisingPortal flavor)
        run: flutter build apk --release --flavor advisingPortal -t lib/main_advising_portal.dart

      - name: Upload advisingPortal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-advisingportal-release
          path: build/app/outputs/flutter-apk/app-advisingportal-release.apk
          retention-days: 30

      - name: Distribute advisingPortal APK via Firebase App Distribution
        run: |
          npx firebase-tools appdistribution:distribute \
            build/app/outputs/flutter-apk/app-advisingportal-release.apk \
            --app 1:843787630334:android:b13a15e0e42a7b19ea97af \
            --release-notes "نشر تلقائي من الفرع main - $(git log -1 --pretty=%s)" \
            --testers "salfawaz50@gmail.com" \
            --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
