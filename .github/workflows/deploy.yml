name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Write secrets.dart
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          mkdir -p lib/config
          KEY=$(printf '%s' "$SENDGRID_API_KEY" | tr -d '\r\n')
          SENDER=$(printf '%s' "$SENDER_EMAIL" | tr -d '\r\n')
          RECIPIENT=$(printf '%s' "$RECIPIENT_EMAIL" | tr -d '\r\n')
          cat > lib/config/secrets.dart <<DARTEOF
          class Secrets {
            static const String sendGridApiKey = "$KEY";
            static const String senderEmail = "$SENDER";
            static const String recipientEmail = "$RECIPIENT";
          }
          DARTEOF

      - name: Generate version files from pubspec.yaml
        run: |
          FULL_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION_NAME=${FULL_VERSION%+*}
          BUILD_NUMBER=${FULL_VERSION#*+}
          cat > lib/app_version.dart <<DARTEOF
          const int kAppBuildNumber = $BUILD_NUMBER;
          const String kAppVersionName = '$VERSION_NAME';
          DARTEOF
          cat > web/version.json <<JSONEOF
          {"build": $BUILD_NUMBER, "version": "$VERSION_NAME"}
          JSONEOF

      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Build APK (advising flavor)
        run: flutter build apk --release --flavor advising -t lib/main_advising_app.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-advising-release
          path: build/app/outputs/flutter-apk/app-advising-release.apk
          retention-days: 30
