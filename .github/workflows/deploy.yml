name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # contents: write مطلوبة لإنشاء GitHub Release (خطوة نظام تحديث بوابة
    # الإرشاد أدناه) - الصلاحية الافتراضية بلا هذا السطر قراءة فقط.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: master

      - name: Write secrets.dart
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          mkdir -p lib/config
          KEY=$(printf '%s' "$SENDGRID_API_KEY" | tr -d '\r\n')
          SENDER=$(printf '%s' "$SENDER_EMAIL" | tr -d '\r\n')
          RECIPIENT=$(printf '%s' "$RECIPIENT_EMAIL" | tr -d '\r\n')
          cat > lib/config/secrets.dart <<DARTEOF
          class Secrets {
            static const String sendGridApiKey = "$KEY";
            static const String senderEmail = "$SENDER";
            static const String recipientEmail = "$RECIPIENT";
          }
          DARTEOF

      - name: Generate version files from pubspec.yaml
        run: |
          FULL_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          VERSION_NAME=${FULL_VERSION%+*}
          BUILD_NUMBER=${FULL_VERSION#*+}
          cat > lib/app_version.dart <<DARTEOF
          const int kAppBuildNumber = $BUILD_NUMBER;
          const String kAppVersionName = '$VERSION_NAME';
          DARTEOF
          cat > web/version.json <<JSONEOF
          {"build": $BUILD_NUMBER, "version": "$VERSION_NAME"}
          JSONEOF

      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # توقيع APK ثابت لكل التشغيلات (بدل مفتاح debug عشوائي جديد بكل مُشغِّل
      # CI) - وإلا يرفض أندرويد أي تحديث لاحق بخطأ "package conflicts with
      # an existing package" (خلل حقيقي واجهه سليمان فعليًا 2026-08-25).
      # انظر التوثيق الكامل بـandroid/app/build.gradle.kts.
      - name: Write Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPEOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          PROPEOF

      # تطبيق "CBA Advising" القديم (flavor `advising`) حُذف بالكامل من
      # المشروع (سليمان صراحةً 2026-09-09) - "بوابة الإرشاد" أدناه هو
      # التطبيق النشط الوحيد الآن.
      - name: Build APK (advisingPortal flavor)
        run: flutter build apk --release --flavor advisingPortal -t lib/main_advising_portal.dart

      - name: Upload advisingPortal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-advisingportal-release
          path: build/app/outputs/flutter-apk/app-advisingportal-release.apk
          retention-days: 30

      - name: Distribute advisingPortal APK via Firebase App Distribution
        run: |
          npx firebase-tools appdistribution:distribute \
            build/app/outputs/flutter-apk/app-advisingportal-release.apk \
            --app 1:843787630334:android:b13a15e0e42a7b19ea97af \
            --release-notes "نشر تلقائي من الفرع main - $(git log -1 --pretty=%s)" \
            --testers "salfawaz50@gmail.com" \
            --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # نشر GitHub Release لبوابة الإرشاد (سليمان صراحةً 2026-09-09) - هذا
      # هو المصدر الوحيد الذي يقرأ منه نظام "التحديث داخل التطبيق"
      # (`PortalUpdateService`، GET /repos/.../releases/latest) - بلا هذه
      # الخطوة تلقائيًا، لن يعمل فحص التحديث إطلاقًا (يحتاج Release منشور
      # فعليًا لا مجرد Artifact بـActions). الوسم يطابق "version+build" من
      # pubspec.yaml بالضبط (مثال 1.0.20+25 → v1.0.20+25)، واسم المرفق يحمل
      # كلمة "portal" صراحةً حتى يميّزه الكود عن أي APK آخر يُرفَع لنفس
      # الإصدار مستقبلاً.
      - name: Create GitHub Release for بوابة الإرشاد
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          TAG="v${FULL_VERSION}"
          cp build/app/outputs/flutter-apk/app-advisingportal-release.apk app-advisingportal-release.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "الإصدار $TAG منشور مسبقًا - تخطّي (تشغيل مُعاد بلا رفع رقم إصدار جديد)"
          else
            gh release create "$TAG" \
              app-advisingportal-release.apk \
              --title "بوابة الإرشاد $TAG" \
              --notes "نشر تلقائي من الفرع main - $(git log -1 --pretty=%s)" \
              --repo "$GITHUB_REPOSITORY"
          fi
